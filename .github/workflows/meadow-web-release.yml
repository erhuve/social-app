name: Meadow Web Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  CI: '1'
  EXPO_PUBLIC_MULTIPLICITY_SERVICE_URL: https://multiplicity-service-hatsunemiku.zocomputer.io
  EXPO_PUBLIC_MULTIPLICITY_SERVICE_DID: did:web:multiplicity-service-hatsunemiku.zocomputer.io
  EXPO_PUBLIC_MULTIPLICITY_FEED_URI: at://did:plc:m6ueqhacjannzmreidcijoj2/app.bsky.feed.generator/raffle

jobs:
  quality:
    name: Validate release source
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  build:
    name: Build immutable web artifact
    needs: quality
    if: >-
      always() &&
      (github.event_name == 'pull_request' || needs.quality.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.1
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile translations
        run: pnpm intl:compile
      - name: Verify SPA serving behavior
        run: python3 scripts/serve_web_spa_test.py
      - name: Build production web client
        run: pnpm build-web
      - name: Install browser for web smoke tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Verify production build in a browser
        run: pnpm test-web-e2e
      - name: Verify fork-owned release destinations
        run: pnpm check-fork-hygiene web-build
      - name: Package commit-addressed artifact
        if: github.event_name != 'pull_request'
        run: scripts/package_web_release.sh "$GITHUB_SHA"
      - name: Verify packaged artifact
        if: github.event_name != 'pull_request'
        run: (cd artifacts && sha256sum -c "meadow-web-$GITHUB_SHA.tar.gz.sha256")
      - name: Verify release lifecycle
        if: github.event_name != 'pull_request'
        env:
          MEADOW_TEST_PACKAGED_ARTIFACT: artifacts
        run: python3 scripts/web_release_test.py
      - name: Upload release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meadow-web-${{ github.sha }}
          path: |
            artifacts/meadow-web-${{ github.sha }}.tar.gz
            artifacts/meadow-web-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest verified web release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meadow-web-${{ github.sha }}
          path: artifacts
      - name: Attest packaged artifact provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/meadow-web-${{ github.sha }}.tar.gz

  publish:
    name: Publish durable web release
    needs: attest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meadow-web-${{ github.sha }}
          path: artifacts
      - name: Publish commit-addressed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_web_release.sh "$GITHUB_SHA"
